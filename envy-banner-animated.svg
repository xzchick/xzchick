<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="envy-title envy-description">
  <title id="envy-title">ENVY — A different frequency</title>
  <desc id="envy-description">An angular luminous ENVY wordmark floating in a midnight galaxy. Neon pink and cyan nebulae breathe slowly behind delicate orbital paths and twinkling stars. Animation is disabled when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="space" x2="1" y2="1">
      <stop stop-color="#080b1c"/>
      <stop offset=".5" stop-color="#050713"/>
      <stop offset="1" stop-color="#030b16"/>
    </linearGradient>
    <radialGradient id="pink-cloud">
      <stop stop-color="#ff269c" stop-opacity=".31"/>
      <stop offset=".4" stop-color="#cb218e" stop-opacity=".13"/>
      <stop offset="1" stop-color="#8d146e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-cloud">
      <stop stop-color="#24eaff" stop-opacity=".25"/>
      <stop offset=".4" stop-color="#138ca6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#08687f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-cloud">
      <stop stop-color="#8547e8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8547e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter-face" x1="0" y1=".2" x2="1" y2=".8">
      <stop stop-color="#ff83d3"/>
      <stop offset=".28" stop-color="#f4dbff"/>
      <stop offset=".57" stop-color="#f2fbff"/>
      <stop offset="1" stop-color="#64edff"/>
    </linearGradient>
    <linearGradient id="spectrum">
      <stop stop-color="#ff3db4"/>
      <stop offset=".48" stop-color="#ac8cff"/>
      <stop offset="1" stop-color="#35e8ff"/>
    </linearGradient>
    <linearGradient id="rail">
      <stop stop-color="#ff3db4" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ff3db4" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#9483dc" stop-opacity=".25"/>
      <stop offset=".8" stop-color="#35e8ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#35e8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset=".45" stop-color="#02040d" stop-opacity="0"/>
      <stop offset="1" stop-color="#02040d" stop-opacity=".72"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-70%" width="200%" height="240%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="star-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <path id="wordmark" d="M 479,162 H 620 L 614,188 H 510 L 504,217 H 593 L 587,243 H 498 L 491,276 H 595 L 589,302 H 448 Z M 645,162 H 680 L 739,253 L 759,162 H 794 L 763,302 H 728 L 669,211 L 649,302 H 614 Z M 816,162 H 853 L 873,259 L 936,162 H 976 L 882,302 H 847 Z M 988,162 H 1027 L 1050,208 L 1105,162 H 1149 L 1066,237 L 1052,302 H 1015 L 1030,237 Z"/>
    <clipPath id="letter-clip"><use href="#wordmark"/></clipPath>
    <clipPath id="canvas-clip"><rect width="1600" height="480" rx="24"/></clipPath>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".4" fill="#c9d9ff" opacity=".14"/>
      <circle cx="4" cy="5" r=".35" fill="#c9d9ff" opacity=".1"/>
    </pattern>
  </defs>
  <style>
    .nebula-pink { animation: pink-drift 18s ease-in-out infinite alternate; transform-origin: 475px 235px; }
    .nebula-cyan { animation: cyan-drift 21s ease-in-out infinite alternate; transform-origin: 1130px 255px; }
    .twinkle-a { animation: twinkle 6s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 8s ease-in-out -3s infinite; }
    .twinkle-c { animation: twinkle 7s ease-in-out -4s infinite; }
    .orbit-signal { animation: orbit-flow 12s linear infinite; }
    .letter-shimmer { animation: shimmer-pass 7s ease-in-out infinite; }
    .comet-pink { animation: comet-pink 6s ease-in-out infinite; }
    .comet-cyan { animation: comet-cyan 8s ease-in-out infinite; }
    @keyframes comet-pink { 0% {transform:translate(0,0);opacity:0;} 10%,75% {opacity:1;} 100% {transform:translate(360px,-95px);opacity:0;} }
    @keyframes comet-cyan { 0% {transform:translate(0,0);opacity:0;} 10%,75% {opacity:1;} 100% {transform:translate(-330px,85px);opacity:0;} }
    .beacon { animation: beacon-pulse 5s ease-in-out infinite; }
    @keyframes pink-drift { from { transform: translate(0,0) scale(1); opacity:.8; } to { transform: translate(24px,-9px) scale(1.08); opacity:1; } }
    @keyframes cyan-drift { from { transform: translate(0,0) scale(1); opacity:1; } to { transform: translate(-20px,12px) scale(1.1); opacity:.7; } }
    @keyframes twinkle { 0%,100% { opacity:.3; } 50% { opacity:.95; } }
    @keyframes orbit-flow { to { stroke-dashoffset:-1378; } }
    @keyframes shimmer-pass { 0%,12% { transform:translateX(-440px); opacity:0; } 20% { opacity:1; } 85% { transform:translateX(850px); opacity:0; } 100% { transform:translateX(850px); opacity:0; } }
    @keyframes beacon-pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .nebula-pink,.nebula-cyan,.twinkle-a,.twinkle-b,.twinkle-c,.orbit-signal,.letter-shimmer,.beacon,.comet-pink,.comet-cyan { animation:none; }
      .letter-shimmer { opacity:0; }
    }
  </style>
  <g clip-path="url(#canvas-clip)">
    <rect width="1600" height="480" fill="url(#space)"/>
    <!-- Slow, diffuse color fields keep the lettering calm and legible. -->
    <g class="nebula-pink">
      <ellipse cx="425" cy="220" rx="520" ry="300" fill="url(#pink-cloud)"/>
      <ellipse cx="620" cy="342" rx="370" ry="170" fill="url(#violet-cloud)"/>
    </g>
    <g class="nebula-cyan">
      <ellipse cx="1155" cy="245" rx="510" ry="295" fill="url(#cyan-cloud)"/>
      <ellipse cx="910" cy="104" rx="350" ry="185" fill="url(#violet-cloud)"/>
    </g>
    <rect width="1600" height="480" fill="url(#grain)" opacity=".25"/>
    <!-- Fine stellar dust. -->
    <g fill="#b7c6e9" opacity=".35">
      <circle cx="91" cy="111" r=".8"/><circle cx="152" cy="284" r=".6"/><circle cx="180" cy="191" r=".8"/><circle cx="217" cy="85" r=".7"/><circle cx="267" cy="325" r="1"/><circle cx="304" cy="144" r=".6"/><circle cx="342" cy="246" r=".7"/><circle cx="382" cy="66" r=".8"/><circle cx="406" cy="388" r=".6"/><circle cx="469" cy="108" r=".7"/><circle cx="493" cy="365" r=".6"/><circle cx="560" cy="71" r=".8"/><circle cx="604" cy="403" r=".7"/><circle cx="672" cy="111" r=".6"/><circle cx="714" cy="61" r=".8"/><circle cx="754" cy="388" r=".7"/><circle cx="809" cy="93" r=".7"/><circle cx="865" cy="416" r=".8"/><circle cx="931" cy="72" r=".6"/><circle cx="970" cy="383" r=".7"/><circle cx="1028" cy="112" r=".7"/><circle cx="1087" cy="401" r=".7"/><circle cx="1156" cy="80" r=".8"/><circle cx="1210" cy="340" r=".7"/><circle cx="1259" cy="132" r=".9"/><circle cx="1308" cy="284" r=".6"/><circle cx="1365" cy="74" r=".7"/><circle cx="1411" cy="184" r=".8"/><circle cx="1468" cy="342" r=".7"/><circle cx="1520" cy="121" r=".6"/><circle cx="128" cy="390" r=".6"/><circle cx="333" cy="412" r=".8"/><circle cx="1230" cy="425" r=".7"/><circle cx="1445" cy="415" r=".6"/>
    </g>
    <g class="twinkle-a" fill="#ffc5ed">
      <circle cx="233" cy="166" r="1.5"/><circle cx="409" cy="292" r="1.1"/><circle cx="584" cy="105" r="1.2"/><circle cx="1228" cy="95" r="1.3"/><circle cx="1394" cy="322" r="1.2"/>
    </g>
    <g class="twinkle-b" fill="#b4f6ff">
      <circle cx="157" cy="337" r="1.3"/><circle cx="365" cy="109" r="1.1"/><circle cx="994" cy="83" r="1.2"/><circle cx="1273" cy="379" r="1.5"/><circle cx="1480" cy="225" r="1.2"/>
    </g>
    <g class="twinkle-c" stroke-linecap="round" fill="none">
      <path d="M 305,225 h 12 M 311,219 v 12" stroke="#ff9fdf" stroke-width="1"/>
      <path d="M 1277,204 h 14 M 1284,197 v 14" stroke="#8aefff" stroke-width="1"/>
      <path d="M 1196,308 h 8 M 1200,304 v 8" stroke="#b5e8ff" stroke-width=".8"/>
      <path d="M 695,83 h 6 M 698,80 v 6" stroke="#d6bcff" stroke-width=".8"/>
    </g>
    <!-- An orbital ribbon crosses behind the wordmark. -->
    <g fill="none">
      <ellipse cx="800" cy="239" rx="618" ry="111" transform="rotate(-12 800 239)" stroke="url(#spectrum)" stroke-width=".8" opacity=".23"/>
      <ellipse cx="800" cy="239" rx="636" ry="119" transform="rotate(-12 800 239)" stroke="url(#spectrum)" stroke-width=".5" opacity=".11"/>
      <ellipse class="orbit-signal" cx="800" cy="239" rx="618" ry="111" transform="rotate(-12 800 239)" stroke="url(#spectrum)" stroke-width="1.4" stroke-dasharray="45 170 2 340 18 290 3 510" opacity=".6"/>
      <path d="M -40,354 C 262,410 442,57 790,103 S 1288,463 1640,149" stroke="url(#rail)" stroke-width=".7" opacity=".24"/>
    </g>
    <g class="comet-pink"><path d="M 180,320 l -60,16" stroke="#ff60c9" stroke-width="2" opacity=".55"/><circle cx="180" cy="320" r="3.5" fill="#ffb3ec"/></g>
    <g class="comet-cyan"><path d="M 1410,145 l 65,-17" stroke="#35e8ff" stroke-width="2" opacity=".55"/><circle cx="1410" cy="145" r="3.5" fill="#aafaff"/></g>
    <!-- Quiet geometric details frame the custom-drawn letters. -->
    <g stroke="url(#rail)" fill="none" opacity=".5">
      <path d="M 359,199 v -37 h 39 M 1203,302 h 39 v -37" stroke-width="1"/>
      <path d="M 359,280 v 22 h 22 M 1220,162 h 22 v 22" stroke-width=".6" opacity=".5"/>
    </g>
    <use href="#wordmark" fill="url(#spectrum)" filter="url(#soft-glow)" opacity=".25"/>
    <use href="#wordmark" transform="translate(-3 2)" fill="none" stroke="#ff38b0" stroke-width="1.2" opacity=".55"/>
    <use href="#wordmark" transform="translate(3 -2)" fill="none" stroke="#2ae6ff" stroke-width="1" opacity=".45"/>
    <use href="#wordmark" fill="url(#letter-face)" stroke="#f4efff" stroke-width=".5" stroke-opacity=".6"/>
    <g clip-path="url(#letter-clip)">
      <path d="M 430,286 H 1160 M 430,290 H 1160 M 430,294 H 1160 M 430,298 H 1160" stroke="#081326" stroke-width="1" opacity=".2"/>
      <path d="M 445,234 H 1155" stroke="#06101c" stroke-width="1.2" opacity=".24"/>
      <path d="M 445,236 H 1155" stroke="white" stroke-width=".6" opacity=".6"/>
      <path class="letter-shimmer" d="M 450,130 H 545 L 485,325 H 390 Z" fill="url(#shimmer)" opacity="0"/>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-weight="400">
      <text x="800" y="344" text-anchor="middle" font-size="12" letter-spacing="6" fill="#b1bbd8">A DIFFERENT FREQUENCY</text>
      <g font-size="9" letter-spacing="2" fill="#8292ae">
        <text x="77" y="59">ENVY / DIGITAL SPACE</text>
        <text x="1523" y="59" text-anchor="end">BEYOND THE ORDINARY</text>
        <text x="77" y="429">01 — COSMIC SIGNAL</text>
        <text x="1523" y="429" text-anchor="end">PINK NOISE / CYAN DREAMS</text>
      </g>
    </g>
    <g class="beacon">
      <circle cx="61" cy="55" r="2.5" fill="#ff57bf"/>
      <circle cx="61" cy="55" r="4" fill="#ff57bf" opacity=".55" filter="url(#star-glow)"/>
    </g>
    <g stroke-width="1" fill="none">
      <path d="M 61,83 v -8 h 24 M 1539,83 v -8 h -24 M 61,397 v 8 h 24 M 1539,397 v 8 h -24" stroke="#8a9ec0" opacity=".3"/>
      <path d="M 680,382 H 920" stroke="url(#rail)" opacity=".5"/>
    </g>
    <g fill="#7b8aa6" opacity=".5">
      <rect x="788" y="379" width="3" height="3"/><rect x="799" y="379" width="3" height="3"/><rect x="810" y="379" width="3" height="3"/>
    </g>
    <rect width="1600" height="480" fill="url(#vignette)" pointer-events="none"/>
    <rect x=".5" y=".5" width="1599" height="479" rx="23.5" fill="none" stroke="#9db6e9" stroke-opacity=".1"/>
  </g>
</svg>
