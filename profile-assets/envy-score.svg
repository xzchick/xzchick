<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">GitHub Score</title>
  <desc id="description">ENVY GitHub score C, 7 out of 100, from commits, pull requests, issues, reviews, stars and followers.</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#a71c7d" stop-opacity=".2"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="718" height="318" rx="20"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.ring{animation:fill 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes fill{from{stroke-dashoffset:32.5}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="720" height="320" fill="#050713"/>
    <ellipse cx="640" cy="160" rx="260" ry="200" fill="url(#cloud)"/>
    <ellipse cx="90" cy="310" rx="320" ry="210" fill="url(#pink)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="446" cy="26" r="1"/><circle cx="562" cy="296" r="1"/><circle cx="690" cy="43" r="1.2"/><circle cx="396" cy="302" r=".8"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="34" y="43" font-size="14" letter-spacing="2.6" font-weight="600" fill="#6ceaff">SIGNAL STRENGTH</text>
      <text x="32" y="80" font-size="28" letter-spacing="1" font-weight="700" fill="#f2f4ff">GitHub Score</text>
    </g>
    <path d="M34 96h55" stroke="#ff3db4" stroke-width="2"/>
    <path d="M95 96h24" stroke="#ac8cff" stroke-opacity=".4" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="34" y="140" font-size="16" fill="#b9c3df">Commits</text><text x="330" y="140" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">58</text><text x="34" y="168" font-size="16" fill="#b9c3df">Pull requests</text><text x="330" y="168" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">6</text><text x="34" y="196" font-size="16" fill="#b9c3df">Issues</text><text x="330" y="196" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">0</text><text x="34" y="224" font-size="16" fill="#b9c3df">Reviews</text><text x="330" y="224" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">0</text><text x="34" y="252" font-size="16" fill="#b9c3df">Stars earned</text><text x="330" y="252" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">0</text><text x="34" y="280" font-size="16" fill="#b9c3df">Followers</text><text x="330" y="280" font-size="17" font-weight="700" fill="#f2f4ff" text-anchor="end">2</text>
    </g>
    <circle cx="580" cy="192" r="74" fill="none" stroke="#1a1f3d" stroke-width="12"/>
    <circle class="ring" cx="580" cy="192" r="74" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="32.5 465.0" transform="rotate(-90 580 192)"/>
    <circle class="signal" cx="580" cy="192" r="90" fill="none" stroke="#35e8ff" stroke-opacity=".25"/>
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="580" y="206" font-size="46" font-weight="700" fill="#f2f4ff">C</text>
      <text x="580" y="232" font-size="14" letter-spacing="1.5" fill="#6ceaff">7 / 100</text>
    </g>
    <text x="34" y="306" font-size="11" fill="#b9c3df" opacity=".6" font-family="Arial, Helvetica, sans-serif">Past 12 months · ENVY formula, not an official GitHub rank</text>
  </g>
  <rect x=".75" y=".75" width="718.5" height="318.5" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
