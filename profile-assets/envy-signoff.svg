<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="160" viewBox="0 0 1600 160" role="img" aria-labelledby="title description">
  <title id="title">Stay a little cosmic</title>
  <desc id="description">An ENVY closing line, framed by a pink and cyan star trail in a dark galaxy.</desc>
  <defs>
    <linearGradient id="trail"><stop stop-color="#ff3db4" stop-opacity="0"/><stop offset=".25" stop-color="#ff3db4" stop-opacity=".7"/><stop offset=".5" stop-color="#b49aff" stop-opacity=".25"/><stop offset=".8" stop-color="#35e8ff" stop-opacity=".7"/><stop offset="1" stop-color="#35e8ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="text"><stop stop-color="#ffc5ed"/><stop offset=".5" stop-color="#f4efff"/><stop offset="1" stop-color="#b4f6ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#54245a" stop-opacity=".23"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
  </defs>
  <style>.stars{animation:twinkle 7s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.stars{animation:none}}</style>
  <rect width="1600" height="160" rx="20" fill="#050713"/>
  <ellipse cx="800" cy="80" rx="650" ry="80" fill="url(#cloud)"/>
  <path d="M48 80H430M1170 80H1552" stroke="url(#trail)" stroke-width="1.5"/>
  <path d="M48 120C240 120 285 12 470 33M1130 127C1300 150 1400 29 1552 40" fill="none" stroke="url(#trail)" stroke-width="1" opacity=".55"/>
  <g class="stars" fill="none" stroke-linecap="round"><path d="M312 80h18m-9-9v18M204 102h8m-4-4v8" stroke="#ff8ad4" stroke-width="1.3"/><path d="M1270 80h18m-9-9v18M1392 53h8m-4-4v8" stroke="#86f0ff" stroke-width="1.3"/></g>
  <g fill="#b4c8e8" opacity=".5"><circle cx="132" cy="45" r="1.2"/><circle cx="405" cy="119" r="1"/><circle cx="1190" cy="42" r="1"/><circle cx="1470" cy="120" r="1.2"/></g>
  <text x="800" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="5" fill="url(#text)">STAY A LITTLE COSMIC</text>
  <rect x=".5" y=".5" width="1599" height="159" rx="19.5" fill="none" stroke="#9db6e9" stroke-opacity=".08"/>
</svg>
