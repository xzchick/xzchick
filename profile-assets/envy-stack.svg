<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Tech Stack</title>
  <desc id="description">Languages across my repositories (Python, PowerShell, Shell, Swift) and the tools I build with: Python, Bash, Qt, SQLite, Ollama, AlmaLinux, KDE Plasma, Podman, RPM, macOS.</desc>
  <defs>
