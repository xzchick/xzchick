hor="middle">KDE Plasma</text><rect x="34" y="274" width="74" height="26" rx="13" fill="#0b1030" stroke="#ac8cff" stroke-opacity=".45"/><text x="71.0" y="292" font-size="13" fill="#6ceaff" text-anchor="middle">Podman</text><rect x="116" y="274" width="50" height="26" rx="13" fill="#0b1030" stroke="#ac8cff" stroke-opacity=".45"/><text x="141.0" y="292" font-size="13" fill="#6ceaff" text-anchor="middle">RPM</text><rect x="174" y="274" width="66" height="26" rx="13" fill="#0b1030" stroke="#ac8cff" stroke-opacity=".45"/><text x="207.0" y="292" font-size="13" fill="#6ceaff" text-anchor="middle">macOS</text></g>
