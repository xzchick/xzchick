<svg xmlns="http://www.w3.org/2000/svg" width="250" height="196" viewBox="0 0 250 196" role="img" aria-labelledby="title description">
  <title id="title">Hypothesis</title>
  <desc id="description">Hypothesis: Weigh competing explanations against the evidence.</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#a71c7d" stop-opacity=".2"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="248" height="194" rx="18"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.sheen{animation:sheen 12s ease-in-out 9.75s infinite}@keyframes sheen{0%{transform:translateX(0)}18%,100%{transform:translateX(470px)}}.ring{animation:rot 16s linear infinite;transform-origin:46px 46px}@keyframes rot{to{transform:rotate(360deg)}}.glow{animation:glow 5s ease-in-out -5.85s infinite}@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="250" height="196" fill="#050713"/>
    <ellipse cx="170" cy="98" rx="150" ry="200" fill="url(#cloud)"/>
    <ellipse cx="90" cy="186" rx="175" ry="210" fill="url(#pink)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="155" cy="26" r="1"/><circle cx="195" cy="172" r="1"/><circle cx="220" cy="43" r="1.2"/><circle cx="138" cy="178" r=".8"/></g>
    <defs>
      <radialGradient id="ig"><stop stop-color="#b07cff" stop-opacity=".45"/><stop offset="1" stop-color="#b07cff" stop-opacity="0"/></radialGradient>
      <linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    </defs>
    <circle class="glow" cx="46" cy="46" r="34" fill="url(#ig)"/>
    <circle cx="46" cy="46" r="24" fill="#0a0e22" stroke="#b07cff" stroke-opacity=".75" stroke-width="1.5"/>
    <circle class="ring" cx="46" cy="46" r="29" fill="none" stroke="#b07cff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="10 8 2 8"/>
    <g transform="translate(34 34) scale(1.000)" fill="none" stroke="#b07cff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-6 3.5-11 6.6"/></g>
    <text x="230" y="34" font-size="11" letter-spacing="1.6" font-weight="600" fill="#b07cff" text-anchor="end" font-family="Arial, Helvetica, sans-serif"></text>
    <g font-family="Arial, Helvetica, sans-serif"><text x="22" y="96" font-size="20" font-weight="700" fill="#f2f4ff">Hypothesis</text><text x="22" y="118" font-size="14.5" fill="#b9c3df">Weigh competing</text><text x="22" y="138" font-size="14.5" fill="#b9c3df">explanations against the</text><text x="22" y="158" font-size="14.5" fill="#b9c3df">evidence.</text></g>
    <path d="M22 178h34" stroke="#b07cff" stroke-width="2"/>
    <g class="sheen"><rect x="-120" y="-30" width="90" height="256" fill="url(#sheen)" transform="skewX(-18)"/></g>
  </g>
  <rect x=".75" y=".75" width="248.5" height="194.5" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
