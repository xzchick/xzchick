<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="298" viewBox="0 0 1000 298" role="img" aria-labelledby="title description">
  <title id="title">Working On</title>
  <desc id="description">Working on: BLACK VEIL — v0.2: on real hardware (1 of 5 steps done); Suite v0.3 — depth and trust for every app (3 of 6 steps done).</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#a71c7d" stop-opacity=".2"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="296" rx="20"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.fill0{stroke-dasharray:1000;animation:fill 7s ease-out 0.0s infinite}.fill1{stroke-dasharray:1000;animation:fill 7s ease-out 0.8s infinite}@keyframes fill{0%{stroke-dashoffset:1000}45%,100%{stroke-dashoffset:0}}.now{animation:now 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes now{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.45;transform:scale(1.25)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
