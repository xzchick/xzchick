    <circle cx="60" cy="90" r="8" fill="#ac8cff"/><path d="M56.5 90l2.4 2.6 4.6-5" fill="none" stroke="#050713" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="120" font-size="12.5" fill="#f2f4ff" opacity="1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="60" dy="0">v0.1.0 released</tspan></text>
