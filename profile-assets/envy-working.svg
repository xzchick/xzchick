    <circle cx="236" cy="222" r="8" fill="#35e8ff"/><path d="M232.5 222l2.4 2.6 4.6-5" fill="none" stroke="#050713" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="252" font-size="12.5" fill="#f2f4ff" opacity="1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="236" dy="0">SBOMs</tspan></text>
    <circle cx="412" cy="222" r="8" fill="#35e8ff"/><path d="M408.5 222l2.4 2.6 4.6-5" fill="none" stroke="#050713" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text y="252" font-size="12.5" fill="#f2f4ff" opacity="1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="412" dy="0">Hardening tests</tspan></text>
    <circle class="now" cx="588" cy="222" r="15" fill="#35e8ff" opacity=".25"/><circle cx="588" cy="222" r="8" fill="#050713" stroke="#35e8ff" stroke-width="2.5"/><text y="252" font-size="12.5" fill="#f2f4ff" opacity="1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="588" dy="0">Window parity</tspan><tspan x="588" dy="15">(5 of 11 apps)</tspan></text>
    <circle cx="764" cy="222" r="7" fill="#050713" stroke="#b9c3df" stroke-opacity=".45" stroke-width="1.5"/><text y="252" font-size="12.5" fill="#b9c3df" opacity=".6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"><tspan x="764" dy="0">Accessibility</tspan><tspan x="764" dy="15">pass</tspan></text>
