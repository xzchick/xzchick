<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Currently Building</title>
  <desc id="description">Currently building, not yet released: BLACK VEIL the standalone OS — build system live, no released ISO yet (IN DEVELOPMENT); ENVY apps v0.2 features (IN PROGRESS); ENVY Terminal v0.1.0 (IN PROGRESS).</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#a71c7d" stop-opacity=".2"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="718" height="318" rx="20"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="720" height="320" fill="#050713"/>
    <ellipse cx="640" cy="160" rx="260" ry="200" fill="url(#cloud)"/>
    <ellipse cx="90" cy="310" rx="320" ry="210" fill="url(#pink)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="446" cy="26" r="1"/><circle cx="562" cy="296" r="1"/><circle cx="690" cy="43" r="1.2"/><circle cx="396" cy="302" r=".8"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="34" y="43" font-size="14" letter-spacing="2.6" font-weight="600" fill="#6ceaff">ON THE WORKBENCH</text>
      <text x="32" y="80" font-size="28" letter-spacing="1" font-weight="700" fill="#f2f4ff">Currently Building</text>
    </g>
    <path d="M34 96h55" stroke="#ff3db4" stroke-width="2"/>
    <path d="M95 96h24" stroke="#ac8cff" stroke-opacity=".4" stroke-width="2"/>
    <circle class="signal" cx="40" cy="140" r="5" fill="#ff3db4"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="58" y="146" font-size="19" font-weight="700" fill="#f2f4ff">BLACK VEIL · the OS</text>
      <text x="58" y="170" font-size="14" fill="#b9c3df">AlmaLinux 10 + KDE Plasma 6 — build system live, no released ISO yet</text>
      <rect x="559" y="128" width="127" height="24" rx="12" fill="none" stroke="#ff3db4" stroke-opacity=".6"/>
      <text x="622" y="144" font-size="11" letter-spacing="1.2" font-weight="600" fill="#ff3db4" text-anchor="middle">IN DEVELOPMENT</text>
      <text x="686" y="170" font-size="12" fill="#b9c3df" opacity=".7" text-anchor="end">updated Nov 8</text>
    </g>
    <circle class="signal" cx="40" cy="200" r="5" fill="#ac8cff"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="58" y="206" font-size="19" font-weight="700" fill="#f2f4ff">ENVY apps · v0.2</text>
      <text x="58" y="230" font-size="14" fill="#b9c3df">Next features in review — roadmaps open, PRs underway, not released yet</text>
      <rect x="578" y="188" width="108" height="24" rx="12" fill="none" stroke="#ac8cff" stroke-opacity=".6"/>
      <text x="632" y="204" font-size="11" letter-spacing="1.2" font-weight="600" fill="#ac8cff" text-anchor="middle">IN PROGRESS</text>
      <text x="686" y="230" font-size="12" fill="#b9c3df" opacity=".7" text-anchor="end">updated Nov 8</text>
    </g>
    <circle cx="40" cy="260" r="5" fill="#35e8ff"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="58" y="266" font-size="19" font-weight="700" fill="#f2f4ff">ENVY Terminal</text>
      <text x="58" y="290" font-size="14" fill="#b9c3df">Local AI in a native window — v0.1.0 not yet released</text>
      <rect x="578" y="248" width="108" height="24" rx="12" fill="none" stroke="#ac8cff" stroke-opacity=".6"/>
      <text x="632" y="264" font-size="11" letter-spacing="1.2" font-weight="600" fill="#ac8cff" text-anchor="middle">IN PROGRESS</text>
      <text x="686" y="290" font-size="12" fill="#b9c3df" opacity=".7" text-anchor="end">last push Nov 2</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="718.5" height="318.5" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
