<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="54" viewBox="0 0 1000 54" role="img" aria-labelledby="title description">
  <title id="title">Investigate</title>
  <desc id="description">Investigate: Find out what's really there</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#a71c7d" stop-opacity=".2"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="52" rx="14"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.travel{animation:travel 6s ease-in-out 1.1s infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(531px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="54" fill="#050713"/>
    <ellipse cx="920" cy="27" rx="260" ry="200" fill="url(#cloud)"/>
    <ellipse cx="90" cy="44" rx="320" ry="210" fill="url(#pink)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="620" cy="26" r="1"/><circle cx="780" cy="30" r="1"/><circle cx="970" cy="43" r="1.2"/><circle cx="550" cy="36" r=".8"/></g>
    <g transform="translate(26 15) scale(1.000)" fill="none" stroke="#35e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></g>
    <text x="62" y="35" font-size="21" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Investigate</text>
    <text x="966" y="34" font-size="13" fill="#b9c3df" text-anchor="end" font-family="Arial, Helvetica, sans-serif">Find out what's really there</text>
    <path d="M221 28h531" stroke="#35e8ff" stroke-opacity=".28" stroke-width="1.5"/>
    <g class="travel"><circle cx="221" cy="28" r="4.5" fill="#35e8ff" opacity=".35"/><circle cx="221" cy="28" r="1.8" fill="#fff"/></g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="52.5" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
